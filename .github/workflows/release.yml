name: Release zrun P0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact P0 preview tag matching Cargo.toml
        type: string
        required: true
        default: v0.1.0-p0.13

permissions:
  contents: read

concurrency:
  group: zrun-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      TARGET_COMMIT: ${{ github.sha }}
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the locked native Linux x86_64 executable
        shell: bash
        run: |
          test "$(uname -sm)" = "Linux x86_64"
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --release --locked -p zrun-cli
      - name: Verify exact source and smoke-test the release assets
        shell: python
        run: |
          import hashlib, os, pathlib, re, shutil, subprocess, tomllib
          root = pathlib.Path.cwd()
          manifest = tomllib.loads((root / 'Cargo.toml').read_text())
          version = manifest['package']['version']
          if not re.fullmatch(r'0\.1\.0-p0\.[1-9][0-9]*', version):
              raise SystemExit('This workflow only publishes a declared P0 preview version')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Requested tag differs from Cargo.toml')
          for member in manifest['workspace']['members']:
              member_version = tomllib.loads((root / member / 'Cargo.toml').read_text())['package']['version']
              if member_version != version:
                  raise SystemExit('Workspace package versions differ')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if sha != os.environ['TARGET_COMMIT']:
              raise SystemExit('Checkout does not match the validated workflow commit')
          if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise SystemExit('Release source is dirty')
          tag_ref = 'refs/tags/' + os.environ['RELEASE_TAG']
          if subprocess.run(['git', 'show-ref', '--verify', '--quiet', tag_ref]).returncode == 0:
              if subprocess.check_output(['git', 'rev-parse', tag_ref + '^{}'], text=True).strip() != sha:
                  raise SystemExit('Existing tag does not refer to the validated source')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zrun-release'
          output.mkdir()
          binary = output / ('zrun-' + version + '-linux-x86_64')
          shutil.copy2(pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'release' / 'zrun', binary)
          smoke_env = dict(os.environ, ZRUN_SHELL='/bin/false', ZRUN_NO_RC='1')
          for args, expected in [
              (['--version'], 'zrun ' + version + '\n'),
              (['--native-shell-version'], '1\n'),
              (['-c', "async probe -- printf 'native-ready'; await probe"], 'native-ready'),
          ]:
              result = subprocess.run([binary, *args], env=smoke_env, capture_output=True, text=True, check=True, timeout=15)
              if result.stdout != expected or result.stderr:
                  raise SystemExit(f'Unexpected native CLI smoke output for {args[0]}')
          archive = output / ('zrun-' + version + '-source.tar.gz')
          subprocess.run(['git', 'archive', '--format=tar.gz', '--prefix=zrun-' + version + '/', '-o', str(archive), sha], check=True)
          (output / 'SOURCE_COMMIT.txt').write_text(sha + '\n', encoding='utf-8')
          lines = [hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name for path in sorted(output.iterdir())]
          (output / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Publish validated P0 preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/zrun-release/"* --target "$TARGET_COMMIT" --prerelease --title "zrun $RELEASE_TAG: P0 preview" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
