name: Source gates (manual)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Optional full commit on the calling revision's history
        type: string
        default: ''
    outputs:
      source_sha:
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Resolve an immutable commit on the calling revision's history
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git cat-file -t "$SOURCE_SHA")" == commit ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  source:
    needs: resolve
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install 1.100.0 Rust source tools
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Record compiler
        run: rustc +1.100.0 -Vv
      - name: Formatting
        run: cargo +1.100.0 fmt --all -- --check
      - name: Workspace tests
        run: cargo +1.100.0 test --workspace --all-targets --locked
      - name: Clippy
        run: cargo +1.100.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Python statistics and evidence tests
        run: |
          python scripts/benchmark.py --self-test
          python scripts/soak.py --self-test
      - name: Runtime dependency boundary
        shell: python
        run: |
          import subprocess
          graph = subprocess.check_output(['cargo', '+1.100.0', 'tree', '-p', 'zrun', '--edges', 'normal', '--all-features', '--locked', '--prefix', 'none'], text=True)
          print(graph)
          assert not any(line.split()[0] == 'tokio' for line in graph.splitlines() if line.strip()), 'Tokio entered the native runtime dependency graph'
      - name: Build comparator for source smoke
        run: cargo +1.100.0 build -p zrun-bench --release --locked
      - name: Comparator protocol smoke (not performance acceptance)
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          binary = pathlib.Path('target/release/zrun-bench' + ('.exe' if os.name == 'nt' else '')).resolve()
          output = pathlib.Path(tempfile.mkdtemp(prefix='zrun-ci-')) / 'smoke'
          subprocess.run(['python', 'scripts/benchmark.py', '--binary', str(binary), '--output', str(output), '--tasks', '1000', '--rounds', '1', '--bootstrap', '100'], check=True)
