name: Rust architecture observation

on:
  pull_request:
    paths: ['**/*.rs', '**/Cargo.toml', '**/Cargo.lock', '**/.cargo/config*', '.github/workflows/deslop-observe.yml']
  push:
    branches: [main]
    paths: ['**/*.rs', '**/Cargo.toml', '**/Cargo.lock', '**/.cargo/config*', '.github/workflows/deslop-observe.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observe:
    name: deslop-please (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
      DESLOP_VERSION: '0.1.3'
      CARGO_TERM_COLOR: never
    steps:
      - name: Install pinned scanner and Rust tools
        working-directory: ${{ runner.temp }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --component rust-analyzer
          cargo install deslop-please --version "=$DESLOP_VERSION" --locked --root "$RUNNER_TEMP/deslop"
          rust-analyzer --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect architecture findings
        shell: bash
        run: |
          report="$RUNNER_TEMP/deslop-report.txt"
          status=0
          "$RUNNER_TEMP/deslop/bin/deslop-please" >"$report" 2>&1 || status=$?

          # Render source-influenced diagnostics as log text, not workflow commands.
          marker="$(cat /proc/sys/kernel/random/uuid)"
          printf '::stop-commands::%s\n' "$marker"
          cat "$report"
          printf '::%s::\n' "$marker"

          case "$status" in
            0) message='Scan completed without findings.' ;;
            1) message='Scan reported architecture findings. See this step’s log; findings do not block CI.' ;;
            *) message="Scan could not complete (exit $status). See this step’s log." ;;
          esac
          printf '### deslop-please %s\n\n%s\n' "$DESLOP_VERSION" "$message" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
