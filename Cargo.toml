[package]
name = "zrun"
version = "0.1.0-p0.11"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "An independent Rust async runtime: correctness-first P0"
repository = "https://github.com/LIghtJUNction/zrun"
readme = "README.md"

[workspace]
resolver = "3"
members = ["crates/zrun-task", "crates/zrun-executor", "crates/zrun-time", "crates/zrun-sync", "crates/zrun-bench", "crates/zrun-io", "crates/zrun-cli", "crates/zrun-plugin-api"]
default-members = [".", "crates/zrun-cli"]

[features]
io = ["dep:zrun-io", "zrun-executor/io"]
process = ["io", "dep:libc"]

[dependencies]
zrun-executor = { version = "=0.1.0-p0.11", path = "crates/zrun-executor" }
zrun-task = { version = "=0.1.0-p0.11", path = "crates/zrun-task" }
zrun-time = { version = "=0.1.0-p0.11", path = "crates/zrun-time" }
zrun-sync = { version = "=0.1.0-p0.11", path = "crates/zrun-sync" }
zrun-io = { version = "=0.1.0-p0.11", path = "crates/zrun-io", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = false
debug = 0
