[package]
name = "zrun-shell-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zrun = { path = "../..", features = ["process"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "process", "io-util", "net"] }

[profile.release]
opt-level = 3
lto = false
debug = 0
