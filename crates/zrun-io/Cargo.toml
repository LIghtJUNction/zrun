[package]
name = "zrun-io"
version = "0.1.0-p0.4"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Asynchronous socket and descriptor readiness for zrun"
repository = "https://github.com/LIghtJUNction/zrun"

[dependencies]
mio = { version = "1.2", features = ["net", "os-poll", "os-ext"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
