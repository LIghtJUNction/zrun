[package]
name = "zrun-bench"
version = "0.1.0-p0.15"
edition = "2024"
rust-version = "1.100"
publish = false
default-run = "zrun-bench"

[dependencies]
zrun = { path = "../..", features = ["io"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
serde_json = "1.0"


[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
