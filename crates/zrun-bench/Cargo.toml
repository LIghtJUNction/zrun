[package]
name = "zrun-bench"
version = "0.1.0-p0.11"
edition = "2024"
rust-version = "1.100"
publish = false
default-run = "zrun-bench"

[dependencies]
zrun = { path = "../..", features = ["io"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
serde_json = "1.0"


[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
