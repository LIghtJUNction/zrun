[package]
name = "zrun-executor"
version = "0.1.0-p0.15"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Bounded single-thread and pool executors for zrun"
repository = "https://github.com/LIghtJUNction/zrun"

[features]
io = ["dep:zrun-io"]

[dependencies]
zrun-task = { version = "=0.1.0-p0.15", path = "../zrun-task" }
zrun-time = { version = "=0.1.0-p0.15", path = "../zrun-time" }
zrun-io = { version = "=0.1.0-p0.15", path = "../zrun-io", optional = true }

[dev-dependencies]
zrun-sync = { version = "=0.1.0-p0.15", path = "../zrun-sync" }
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
