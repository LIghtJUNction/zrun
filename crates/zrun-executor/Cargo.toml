[package]
name = "zrun-executor"
version = "0.1.0-p0.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[features]
io = ["dep:zrun-io"]

[dependencies]
zrun-task = { path = "../zrun-task" }
zrun-time = { path = "../zrun-time" }
zrun-io = { path = "../zrun-io", optional = true }

[dev-dependencies]
zrun-sync = { path = "../zrun-sync" }
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
