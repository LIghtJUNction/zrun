[package]
name = "zrun-plugin-api"
version = "0.1.0-p0.4"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
zplugin = { git = "https://github.com/LIghtJUNction/zplugin.git", features = ["macros"] }

[dev-dependencies]
zplugin = { git = "https://github.com/LIghtJUNction/zplugin.git", features = ["std"] }

[[example]]
name = "restrictive"
crate-type = ["cdylib"]

[[example]]
name = "restrictive_args"
crate-type = ["cdylib"]
