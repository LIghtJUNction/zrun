[package]
name = "zrun-cli"
version = "0.1.0-p0.13"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Linux shell and MCP command broker for parallel agent workloads"
repository = "https://github.com/LIghtJUNction/zrun"

[[bin]]
name = "zrun"
path = "src/main.rs"
doc = false

[target.'cfg(target_os = "linux")'.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
zrun = { version = "=0.1.0-p0.13", path = "../..", features = ["process"] }
httparse = "1.10"
sha2 = "0.10.9"
signal-hook = "0.3"
z64 = { git = "https://github.com/LIghtJUNction/z64.git" }
zguard = { git = "https://github.com/LIghtJUNction/zguard.git" }
zplugin = { git = "https://github.com/LIghtJUNction/zplugin.git", features = ["std"] }
zrun-plugin-api = { version = "=0.1.0-p0.13", path = "../zrun-plugin-api" }
libc = "0.2"
