[package]
name = "zrun-cli"
version = "0.1.0-p0.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[[bin]]
name = "zrun"
path = "src/main.rs"
doc = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
zrun = { path = "../..", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
httparse = "1.10"
signal-hook = "0.3"
z64 = { git = "https://github.com/LIghtJUNction/z64.git" }
zguard = { git = "https://github.com/LIghtJUNction/zguard.git" }
zplugin = { git = "https://github.com/LIghtJUNction/zplugin.git", features = ["std"] }
zrun-plugin-api = { path = "../zrun-plugin-api" }
libc = "0.2"
